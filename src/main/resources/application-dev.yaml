quarkus:

  datasource:
    devservices:
      port: 5432
      reuse: false
      volumes:
        "./sql-data": /var/lib/postgresql/data

  flyway:
    clean-at-start: false

  http:
    port: 8080

    cors:
      enabled: true
      origins: "http://localhost:5173"

  security:
    auth:
      enabled-in-dev-mode: true

app:
  memrise:
    access-token: ${MEMRISE_TOKEN}